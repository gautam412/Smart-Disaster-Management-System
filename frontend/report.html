<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report an Incident</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Report a Disaster Incident</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="map.html">Map</a>
      <a href="report.html" class="active">Report</a>
      <a href="resources.html">Resources</a>
      <a href="admin.html">Admin</a>
      <button id="theme-toggle" class="theme-toggle-btn">🌙</button>
    </nav>
  </header>

  <main class="report-container">
    <div class="chat-section">
      <h3>💬 Chat Support</h3>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Type your message..." />
        <button id="send-chat">Send</button>
      </div>
    </div>
    <div class="form-section">
      <h2>🚨 Report a Disaster Incident</h2>
      <form id="incidentForm">
        <div class="form-group">
          <label for="name">👤 Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="location">📍 Location</label>
          <input type="text" id="location" name="location" placeholder="Enter the location" required>
        </div>
        <div class="form-group">
          <label for="disasterType">🌪️ Disaster Type</label>
          <select id="disasterType" name="disasterType" required>
            <option value="">Select Disaster Type</option>
            <option>🌊 Flood</option>
            <option>🏔️ Landslide</option>
            <option>☁️ Cloudburst</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">📝 Description</label>
          <textarea id="description" name="description" placeholder="Describe the situation in detail..." required></textarea>
        </div>
        <div class="form-group">
          <label for="image">📸 Upload Image (Optional)</label>
          <input type="file" id="image" name="image" accept="image/*">
        </div>
        <button type="submit" class="submit-btn">🚀 Submit Report</button>
      </form>
    </div>
  </main>

  <footer>Help authorities respond faster — report accurately.</footer>
</body>
</html>
